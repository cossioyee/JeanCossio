---
apiVersion: v1
kind: Namespace
metadata:
  name: jeancossio
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-cvia
  namespace: jeancossio
  labels:
    app: nginx-cvia
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-cvia
  template:
    metadata:
      labels:
        app: nginx-cvia
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.4
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-cvia
  namespace: jeancossio
  labels:
    app: nginx-cvia
spec:
  type: NodePort
  selector:
    app: nginx-cvia
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
